<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titel, Beschreibung, og:* und canonical setzt src/lib/page-meta.ts (Vite-Plugin beim Build, Router im Browser) -->
    <title>Wartungsheft</title>
    <meta name="description" content="" />
    <meta name="keywords" content="Serviceheft, digitales Serviceheft, Serviceheft App, Auto Wartung App, Werkstattrechnung, MFK, Fuhrpark App, Schweiz" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:type" content="website" />
    <!--
      Strukturierte Daten: was das Produkt ist, was es kostet, wer es anbietet. Die Preise stehen auch in
      plans.ts; wer sie dort ändert, ändert sie hier mit.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Wartungsheft",
        "url": "https://wartungsheft.ch/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, iOS, Android",
        "description": "Digitales Serviceheft für Fahrzeuge aus der Schweiz: Werkstattrechnung fotografieren, die App liest Werkstatt, Datum, Betrag und Arbeiten heraus und führt daraus den Wartungsplan mit Fälligkeiten und E-Mail-Erinnerungen.",
        "inLanguage": "de-CH",
        "offers": [
          {
            "@type": "Offer",
            "name": "Privat",
            "price": "25",
            "priceCurrency": "CHF",
            "description": "Jahresabo für Privathalter, bis 5 Fahrzeuge. 30 Tage gratis testen."
          },
          {
            "@type": "Offer",
            "name": "Betrieb",
            "price": "36",
            "priceCurrency": "CHF",
            "description": "Jahresabo pro Fahrzeug für Betriebe, Rechnung auf die Firma. 30 Tage gratis testen."
          }
        ],
        "provider": {
          "@type": "Organization",
          "name": "Strainovic IT",
          "url": "https://wartungsheft.ch/",
          "email": "info@wartungsheft.ch",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Bahnstrasse 9b",
            "postalCode": "9323",
            "addressLocality": "Steinach",
            "addressCountry": "CH"
          }
        }
      }
    </script>
    <!-- Preconnect to Google Fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
