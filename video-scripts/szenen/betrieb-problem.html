<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Szene 1 Betrieb: Welcher Lieferwagen ist fällig?</title>
<!--
  Rahmen des Betriebsfilms: am Anfang die Frage (vier gleiche Lieferwagen, niemand weiss, welcher dran ist), am
  Ende dieselbe Aufstellung mit Status. Welche Fassung, entscheidet ?antwort=1 in der Adresse.
  Aufnahme über e2e/video/zeichnung.video.ts.
-->
<style>
  :root {
    --ink: #1f2329;
    --bg: #ffffff;
    --van: #eef1f5;
    --van-line: #9aa0a6;
    --ok: #10b981;
    --warn: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); }
  body { display: grid; place-items: center; font-family: 'Segoe UI', system-ui, sans-serif; }

  .stage { position: relative; width: 100vw; height: 100vh; }
  .title {
    position: absolute; top: 12vh; left: 0; right: 0; text-align: center; padding: 0 26px;
    color: var(--ink); font-size: 26px; font-weight: 600; line-height: 1.35;
    opacity: 0; animation: fade-in 700ms ease-out 300ms forwards;
  }
  .title small { display: block; margin-top: 10px; font-size: 17px; font-weight: 400; color: #6b7280; opacity: 0; animation: fade-in 700ms ease-out 1600ms forwards; }

  /* Im Breitbild passen die vier Fahrzeuge nebeneinander schlecht; sie bleiben untereinander, nur kleiner */
  .fleet { position: absolute; top: 44%; left: 0; right: 0; display: grid; gap: min(18px, 2vh); justify-items: center; }
  .fleet svg { width: min(264px, 42vw); height: auto; }
  /* Die pulsierende Markierung darf über den viewBox-Rand hinaus wachsen */
  .van { overflow: visible; opacity: 0; transform: translateX(-30px); animation: roll-in 700ms cubic-bezier(.2,.8,.3,1) forwards; }
  .van:nth-child(1) { animation-delay: 900ms; }
  .van:nth-child(2) { animation-delay: 1150ms; }
  .van:nth-child(3) { animation-delay: 1400ms; }
  .van:nth-child(4) { animation-delay: 1650ms; }

  .badge { opacity: 0; animation: fade-in 400ms ease-out 2400ms forwards; }
  /* In der Frage-Fassung ist noch nichts bekannt: keine Status-Punkte */
  body.frage .status { display: none; }
  .frage-zeichen { opacity: 0; animation: fade-in 500ms ease-out 2200ms forwards; }
  .pulse { transform-origin: center; animation: pulse 1400ms ease-in-out 2400ms infinite; }

  /* Breitbild: zwei Reihen à zwei Fahrzeuge, sonst reicht die Höhe nicht */
  @media (min-aspect-ratio: 1/1) {
    .fleet { top: 38%; grid-template-columns: 1fr 1fr; gap: 1.5vh 2vw; }
    .fleet svg { width: min(264px, 27vw); }
  }

  @keyframes fade-in { to { opacity: 1; } }
  @keyframes roll-in { to { opacity: 1; transform: translateX(0); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.12); opacity: .75; } }
</style>
</head>
<body>
  <div class="stage">
    <p class="title" id="titel"></p>

    <div class="fleet">
      <!-- Vorlage eines Transporters; der dritte trägt die rote Meldung -->
      <svg class="van" width="264" height="100" viewBox="20 0 264 100" aria-hidden="true">
        <!-- Kastenwagen von der Seite: Laderaum links, Kabine mit schräger Scheibe rechts -->
        <path d="M40 16h132l30 30h30a10 10 0 0 1 10 10v22H40z" fill="var(--van)"/>
        <path d="M172 16l30 30" stroke="var(--van-line)" stroke-width="3" stroke-linecap="round"/>
        <path d="M176 22l22 22h-22z" fill="#c3ccd6"/>
        <rect x="56" y="28" width="44" height="22" rx="3" fill="#d7dde5"/>
        <circle cx="90" cy="78" r="14" fill="#3f444c"/><circle cx="90" cy="78" r="5" fill="#9aa3ad"/>
        <circle cx="196" cy="78" r="14" fill="#3f444c"/><circle cx="196" cy="78" r="5" fill="#9aa3ad"/>
        <path d="M30 92h222" stroke="#d3d8de" stroke-width="4" stroke-linecap="round"/>
        <circle class="status" cx="246" cy="14" r="7" fill="var(--ok)"/>
      </svg>
      <svg class="van" width="264" height="100" viewBox="20 0 264 100" aria-hidden="true">
        <!-- Kastenwagen von der Seite: Laderaum links, Kabine mit schräger Scheibe rechts -->
        <path d="M40 16h132l30 30h30a10 10 0 0 1 10 10v22H40z" fill="var(--van)"/>
        <path d="M172 16l30 30" stroke="var(--van-line)" stroke-width="3" stroke-linecap="round"/>
        <path d="M176 22l22 22h-22z" fill="#c3ccd6"/>
        <rect x="56" y="28" width="44" height="22" rx="3" fill="#d7dde5"/>
        <circle cx="90" cy="78" r="14" fill="#3f444c"/><circle cx="90" cy="78" r="5" fill="#9aa3ad"/>
        <circle cx="196" cy="78" r="14" fill="#3f444c"/><circle cx="196" cy="78" r="5" fill="#9aa3ad"/>
        <path d="M30 92h222" stroke="#d3d8de" stroke-width="4" stroke-linecap="round"/>
        <circle class="status" cx="246" cy="14" r="7" fill="var(--ok)"/>
      </svg>
      <svg class="van" width="264" height="100" viewBox="20 0 264 100" aria-hidden="true">
        <!-- Kastenwagen von der Seite: Laderaum links, Kabine mit schräger Scheibe rechts -->
        <path d="M40 16h132l30 30h30a10 10 0 0 1 10 10v22H40z" fill="var(--van)"/>
        <path d="M172 16l30 30" stroke="var(--van-line)" stroke-width="3" stroke-linecap="round"/>
        <path d="M176 22l22 22h-22z" fill="#c3ccd6"/>
        <rect x="56" y="28" width="44" height="22" rx="3" fill="#d7dde5"/>
        <circle cx="90" cy="78" r="14" fill="#3f444c"/><circle cx="90" cy="78" r="5" fill="#9aa3ad"/>
        <circle cx="196" cy="78" r="14" fill="#3f444c"/><circle cx="196" cy="78" r="5" fill="#9aa3ad"/>
        <path d="M30 92h222" stroke="#d3d8de" stroke-width="4" stroke-linecap="round"/>
        <g class="badge status"><circle class="pulse" cx="246" cy="14" r="8" fill="var(--warn)"/></g>
      </svg>
      <svg class="van" width="264" height="100" viewBox="20 0 264 100" aria-hidden="true">
        <!-- Kastenwagen von der Seite: Laderaum links, Kabine mit schräger Scheibe rechts -->
        <path d="M40 16h132l30 30h30a10 10 0 0 1 10 10v22H40z" fill="var(--van)"/>
        <path d="M172 16l30 30" stroke="var(--van-line)" stroke-width="3" stroke-linecap="round"/>
        <path d="M176 22l22 22h-22z" fill="#c3ccd6"/>
        <rect x="56" y="28" width="44" height="22" rx="3" fill="#d7dde5"/>
        <circle cx="90" cy="78" r="14" fill="#3f444c"/><circle cx="90" cy="78" r="5" fill="#9aa3ad"/>
        <circle cx="196" cy="78" r="14" fill="#3f444c"/><circle cx="196" cy="78" r="5" fill="#9aa3ad"/>
        <path d="M30 92h222" stroke="#d3d8de" stroke-width="4" stroke-linecap="round"/>
        <circle class="status" cx="246" cy="14" r="7" fill="var(--ok)"/>
      </svg>
    </div>
  </div>

  <script>
    const antwort = new URLSearchParams(location.search).has('antwort')
    document.body.classList.toggle('frage', !antwort)
    document.getElementById('titel').innerHTML = antwort
      ? 'Jetzt siehst du es<br>auf einen Blick.<small>Einer ist überfällig.</small>'
      : 'Montagmorgen im Betrieb.<br>Welcher muss zum Service?<small>Vier Fahrzeuge, vier Ordner.</small>'
  </script>
</body>
</html>
