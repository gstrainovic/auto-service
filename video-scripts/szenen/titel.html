<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Titelkarte</title>
<!--
  Titelkarte zwischen den Clips. Text kommt aus der Adresse, damit eine Datei für alle Karten reicht:
  titel.html?t=Rechnung%20fotografieren&s=Der%20Rest%20geht%20von%20selbst
  Aufnahme über e2e/video/zeichnung.video.ts.
-->
<style>
  :root { --ink: #1f2329; --muted: #6b7280; --bg: #ffffff; --accent: #10b981; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); }
  body { display: grid; place-items: center; font-family: 'Segoe UI', system-ui, sans-serif; text-align: center; padding: 0 30px; }

  h1 { color: var(--ink); font-size: 30px; font-weight: 700; line-height: 1.3; opacity: 0;
       animation: rise 700ms cubic-bezier(.2,.8,.3,1) 250ms forwards; }
  p { margin-top: 14px; color: var(--muted); font-size: 19px; line-height: 1.45; opacity: 0;
      animation: rise 700ms cubic-bezier(.2,.8,.3,1) 900ms forwards; }
  .rule { width: 64px; height: 4px; border-radius: 2px; background: var(--accent); margin: 26px auto 0;
          transform: scaleX(0); transform-origin: center; animation: grow 600ms ease-out 1500ms forwards; }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes grow { to { transform: scaleX(1); } }
</style>
</head>
<body>
  <div>
    <h1 id="t"></h1>
    <p id="s"></p>
    <div class="rule"></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search)
    document.getElementById('t').textContent = q.get('t') ?? ''
    const sub = document.getElementById('s')
    sub.textContent = q.get('s') ?? ''
    if (!sub.textContent) sub.remove()
  </script>
</body>
</html>
