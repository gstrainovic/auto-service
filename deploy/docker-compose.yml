# PWA + AI-Proxy auf der Hetzner-VM. InstantDB läuft separat (offizieller VPS-Guide).
# Start: docker compose --env-file .env up -d   (im Ordner deploy/, dist/ vorher per rsync nach ./dist)
services:
  ai-proxy:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8787
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      INSTANT_API_URI: ${INSTANT_API_URI}
      INSTANT_APP_ID: ${INSTANT_APP_ID}
      INSTANT_ADMIN_TOKEN: ${INSTANT_ADMIN_TOKEN}
      CORS_ORIGIN: https://${APP_DOMAIN}
      APP_URL: https://${APP_DOMAIN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_BASIC: ${STRIPE_PRICE_BASIC:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
    expose:
      - '8787'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      AI_PROXY_DOMAIN: ${AI_PROXY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv/app:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ai-proxy

volumes:
  caddy_data:
  caddy_config:
