# AI-Proxy neben dem InstantDB-Stack (/opt/instant, offizieller VPS-Guide). Kein eigener Caddy:
# der Caddy des InstantDB-Stacks bedient auch die PWA (./dist) und den Proxy, siehe Caddyfile und README.
# Der AI-Proxy kommt aus dem Repo gstrainovic/ai-proxy, das neben auto-service ausgecheckt sein muss (../../ai-proxy).
# Start: docker compose --env-file .env up -d --build   (im Ordner deploy/, dist/ vorher per rsync nach ./dist)
services:
  ai-proxy:
    build:
      context: ../../ai-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8787
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      INSTANT_API_URI: ${INSTANT_API_URI}
      INSTANT_APP_ID: ${INSTANT_APP_ID}
      INSTANT_ADMIN_TOKEN: ${INSTANT_ADMIN_TOKEN}
      CORS_ORIGIN: https://${APP_DOMAIN}
      APP_URL: https://${APP_DOMAIN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_BASIC: ${STRIPE_PRICE_BASIC:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      # Jahresrechnung für Betriebe (QR-Rechnung per Resend); ohne INVOICE_IBAN Rechnung von Hand (Auftrag an INVOICE_EMAIL bzw. FEEDBACK_TO)
      INVOICE_IBAN: ${INVOICE_IBAN:-}
      INVOICE_CREDITOR_NAME: ${INVOICE_CREDITOR_NAME:-}
      INVOICE_TRADE_NAME: ${INVOICE_TRADE_NAME:-}
      INVOICE_BRAND: ${INVOICE_BRAND:-}
      INVOICE_STREET: ${INVOICE_STREET:-}
      INVOICE_ZIP: ${INVOICE_ZIP:-}
      INVOICE_CITY: ${INVOICE_CITY:-}
      INVOICE_EMAIL: ${INVOICE_EMAIL:-}
      INVOICE_WEBSITE: ${INVOICE_WEBSITE:-}
      INVOICE_FROM: ${INVOICE_FROM:-}
      RESEND_TOKEN: ${RESEND_TOKEN:-}
      # Rückmeldungen aus der App; ohne FEEDBACK_TO (oder INVOICE_EMAIL) antwortet /feedback mit 501
      FEEDBACK_TO: ${FEEDBACK_TO:-}
      FEEDBACK_FROM: ${FEEDBACK_FROM:-}
      # Abo-Job (Dienst billing) ruft /billing/renew und /billing/paid mit diesem Geheimnis auf
      AI_PROXY_INTERNAL_TOKEN: ${AI_PROXY_INTERNAL_TOKEN:-}
    expose:
      - '8787'
    networks:
      - instant

  # Erinnerungs-Job (E-Mail bei fälligen Arbeiten, scripts/reminders.ts gebündelt nach ./reminders.mjs).
  # Kein Dauerdienst: Cron auf der Instanz ruft täglich `docker compose --env-file .env --profile jobs run --rm reminders`.
  reminders:
    # Node 24 = aktuelles LTS, dieselbe Linie wie der AI-Proxy
    image: node:24-alpine
    profiles: [jobs]
    volumes:
      - ./reminders.mjs:/app/reminders.mjs:ro
    environment:
      INSTANT_API_URI: ${INSTANT_API_URI}
      INSTANT_APP_ID: ${INSTANT_APP_ID}
      INSTANT_ADMIN_TOKEN: ${INSTANT_ADMIN_TOKEN}
      RESEND_TOKEN: ${RESEND_TOKEN}
    command: node /app/reminders.mjs
    networks:
      - instant

  # Abo-Job für Betriebe (scripts/billing.ts gebündelt nach ./billing.mjs): Verlängerungen 30 Tage vor Ablauf,
  # offene Rechnungen, Zahlung eintragen. Cron ruft täglich `... --profile jobs run --rm billing` (Befehl renew).
  billing:
    image: node:24-alpine
    profiles: [jobs]
    volumes:
      - ./billing.mjs:/app/billing.mjs:ro
    environment:
      INSTANT_API_URI: ${INSTANT_API_URI}
      INSTANT_APP_ID: ${INSTANT_APP_ID}
      INSTANT_ADMIN_TOKEN: ${INSTANT_ADMIN_TOKEN}
      AI_PROXY_URL: http://ai-proxy:8787
      AI_PROXY_INTERNAL_TOKEN: ${AI_PROXY_INTERNAL_TOKEN}
    command: node /app/billing.mjs renew
    networks:
      - instant

networks:
  # Netz des InstantDB-Stacks, damit dessen Caddy `ai-proxy:8787` erreicht
  instant:
    name: ${INSTANT_NETWORK:-instant_default}
    external: true
